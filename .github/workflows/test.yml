name: EchoWorld v0.01 tests

on:
  push:
    branches:
      - 'chatgpt/echoworld-lane-01'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require exact PR head checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          printf 'expected PR head: %s\nactual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head_sha"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic harness tests
        run: npm test
