name: EchoWorld v0.01 tests

on:
  push:
    branches:
      - 'chatgpt/echoworld-lane-01'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic harness tests
        run: npm test
