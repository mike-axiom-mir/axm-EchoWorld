name: EchoWorld v0.01 tests

on:
  push:
    branches:
      - 'chatgpt/echoworld-lane-01'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact source head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          printf 'expected source head: %s\nactual checkout: %s\nevent GITHUB_SHA: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head_sha" "$GITHUB_SHA"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic harness tests
        run: npm test
